name: Prepare Production promotion evidence only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source SHA for the approved candidate
        required: true
        type: string
      image_uri:
        description: Immutable image URI verified by the human administrator
        required: true
        type: string
      candidate_revision:
        description: Exact ready zero-traffic candidate revision
        required: true
        type: string
      candidate_preparation_run_id:
        description: Successful candidate-preparation workflow run ID
        required: true
        type: string
      human_candidate_evidence_json:
        description: Non-secret compact JSON recorded by the human administrator after candidate verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare-promotion-evidence:
    if: github.repository == 'rentchaincanada/rentchain' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_URI: ${{ inputs.image_uri }}
      CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
      PREPARATION_RUN_ID: ${{ inputs.candidate_preparation_run_id }}
      HUMAN_CANDIDATE_EVIDENCE: ${{ inputs.human_candidate_evidence_json }}
      PROJECT_ID: project-0d9658de-af29-4dc0-a99
      REGION: us-central1
      SERVICE: rentchain-landlord-api
      REQUEST_ID: promotion-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ACTOR: ${{ github.actor }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promotion request and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-deployment/validate-release-inputs.sh \
            promotion "${SOURCE_SHA}" "${IMAGE_URI}" "${PROJECT_ID}" "${REGION}" "${SERVICE}"
          [[ "${CANDIDATE_REVISION}" =~ ^rentchain-landlord-api-candidate-[0-9a-f]{12}$ ]]
          [[ "${PREPARATION_RUN_ID}" =~ ^[0-9]+$ ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main

      - name: Require successful candidate preparation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARATION_RUN_ID}")"
          test "$(jq -r '.name' <<<"${run_json}")" = "Prepare Production candidate evidence only"
          test "$(jq -r '.event' <<<"${run_json}")" = "workflow_dispatch"
          test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
          test "$(jq -r '.head_branch' <<<"${run_json}")" = "main"

      - name: Download candidate request evidence
        uses: actions/download-artifact@v4
        with:
          name: production-candidate-request
          path: candidate-request
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_preparation_run_id }}

      - name: Validate candidate and human-admin evidence binding
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${HUMAN_CANDIDATE_EVIDENCE}" > human-candidate-evidence.json
          request=candidate-request/candidate-request.json
          test "$(jq -r '.sourceSha' "${request}")" = "${SOURCE_SHA}"
          test "$(jq -r '.imageUri' "${request}")" = "${IMAGE_URI}"

      - name: Prepare inert promotion request evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-deployment/prepare-human-promotion.sh \
            candidate-request/candidate-request.json \
            human-candidate-evidence.json \
            "${REQUEST_ID}" \
            "${RUN_URL}" \
            "${RUN_ACTOR}" \
            promotion-request.json
          jq -e '
            .status == "prepared" and
            .candidateReady == true and
            .candidateTrafficPercent == 0 and
            .templateParityPassed == true and
            .currentServingTrafficPercent == 100 and
            .productionHealthStatus == 200 and
            .trafficMutationPerformed == false
          ' promotion-request.json >/dev/null
          test "$(jq -r '.candidateRevision' promotion-request.json)" = "${CANDIDATE_REVISION}"

      - name: Record promotion preparation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production promotion request prepared'
            echo
            echo '**NO TRAFFIC MUTATION PERFORMED**'
            echo
            echo 'This workflow cannot authenticate to Google Cloud and cannot change traffic.'
            echo 'A separate Founder promotion authorization and interactive human-admin execution are required.'
            echo
            jq -r '"Request: `\(.promotionRequestId)`\n\nCandidate: `\(.candidateRevision)`\n\nImage: `\(.imageUri)`"' promotion-request.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload non-secret promotion request evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-request
          path: promotion-request.json
          if-no-files-found: error
          retention-days: 30
