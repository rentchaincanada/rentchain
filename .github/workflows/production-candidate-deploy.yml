name: Prepare Production candidate evidence only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source SHA reachable from main
        required: true
        type: string
      image_uri:
        description: Immutable Production image URI ending in @sha256:<digest>
        required: true
        type: string
      expected_tag:
        description: Expected immutable provenance tag in the form sha-<40-character SHA>
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-candidate-evidence:
    if: github.repository == 'rentchaincanada/rentchain' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_URI: ${{ inputs.image_uri }}
      EXPECTED_TAG: ${{ inputs.expected_tag }}
      PROJECT_ID: project-0d9658de-af29-4dc0-a99
      REGION: us-central1
      SERVICE: rentchain-landlord-api
      REQUEST_ID: candidate-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ACTOR: ${{ github.actor }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release request and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-deployment/validate-release-inputs.sh \
            candidate "${SOURCE_SHA}" "${IMAGE_URI}" "${PROJECT_ID}" "${REGION}" "${SERVICE}"
          test "${EXPECTED_TAG}" = "sha-${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main

      - name: Prepare inert candidate request evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production-deployment/prepare-human-candidate.sh \
            "${SOURCE_SHA}" \
            "${IMAGE_URI}" \
            "${EXPECTED_TAG}" \
            "${PROJECT_ID}" \
            "${REGION}" \
            "${SERVICE}" \
            "${REQUEST_ID}" \
            "${RUN_URL}" \
            "${RUN_ACTOR}" \
            candidate-request.json
          jq -e '.status == "prepared" and .cloudMutationPerformed == false' candidate-request.json >/dev/null

      - name: Record candidate preparation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production candidate request prepared'
            echo
            echo '**NO CLOUD MUTATION PERFORMED**'
            echo
            echo 'This workflow cannot authenticate to Google Cloud and cannot deploy.'
            echo 'A Founder-authorized human administrator must revalidate the artifact and execute the inert command separately.'
            echo
            jq -r '"Request: `\(.candidateRequestId)`\n\nSource: `\(.sourceSha)`\n\nImage: `\(.imageUri)`"' candidate-request.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload non-secret candidate request evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-request
          path: candidate-request.json
          if-no-files-found: error
          retention-days: 30
